      '<section class="view-enter stack">' +
      pageHead('شناسایی چهره از گالری', 'تصویر را انتخاب کنید تا چهره‌ها پیدا و با پرونده‌ها مقایسه شوند') +
      (ready ? '' : '<div class="alert warn">' + icon('i-warn') + '<div><b>موتور فعال نیست.</b><br>برای شناسایی باید ابتدا موتور تشخیص را فعال کنید.' +
        '<div style="margin-top:8px"><button class="btn sm primary" type="button" data-act="engine-activate">' + icon('i-bolt') + ' فعال‌سازی موتور</button></div></div></div>') +
      '<div class="card">' +
      '<div class="btn-row stretch">' +
      '<button class="btn primary" type="button" data-act="recog-pick">' + icon('i-image') + ' انتخاب تصویر</button>' +
      (r.dataUrl ? '<button class="btn" type="button" data-act="recog-clear">' + icon('i-x') + ' حذف تصویر</button>' : '') +
      '</div>' +
      '<div class="hint" style="margin-top:8px">آستانه تطبیق فعلی: <b>' + esc(Engine.thresholdLabel(th)) + '</b> (فاصله اقلیدسی ' + esc(faNum(th.toFixed(2))) + ') — از تنظیمات قابل تغییر است.</div>' +
      (r.dataUrl
        ? '<div class="preview-box" style="margin-top:12px" id="recogPreview"><img src="' + r.dataUrl + '" alt="تصویر ورودی" id="recogImg"><div class="overlay" id="recogOverlay"></div></div>'
        : '<div style="margin-top:12px">' + emptyBox('i-scan', 'تصویری انتخاب نشده', 'یک تصویر با چهره واضح انتخاب کنید.') + '</div>') +
      (r.dataUrl ? '<button class="btn primary block" type="button" data-act="recog-run" style="margin-top:12px" id="btnRecogRun"' + (ready ? '' : ' disabled') + '>' + icon('i-target') + ' پردازش و شناسایی</button>' : '') +
      '</div>' +
      '<div id="recogResult"></div>' +
      '</section>';

    if (r.result) paintRecogResult();
    if (r.dataUrl && r.result) paintOverlay(r.result);
  }

  function paintOverlay(result) {
    const overlay = document.getElementById('recogOverlay');
    const img = document.getElementById('recogImg');
    if (!overlay || !img) return;
    if (!Settings.data.showBoxes || !result || !result.faces) { overlay.innerHTML = ''; return; }
    let tries = 0;
    const doPaint = () => {
      tries++;
      const cw = img.clientWidth, ch = img.clientHeight;
      if ((!cw || !ch) && tries < 60) { requestAnimationFrame(doPaint); return; }
      if (!cw || !ch) return;
      const natW = img.naturalWidth || cw, natH = img.naturalHeight || ch;
      const scaleX = cw / natW, scaleY = ch / natH;
      overlay.innerHTML = result.faces.map((f) => {
        const top = f.match && f.match.accepted ? f.match.record : null;
        const cls = top ? 'face-box' : 'face-box unknown';
        const label = top ? Records.name(top) : 'ناشناس';
        const left = f.box.x * scaleX;
        const topPx = f.box.y * scaleY;
        return '<div class="' + cls + '" style="left:' + left + 'px;top:' + topPx + 'px;width:' +
          (f.box.width * scaleX) + 'px;height:' + (f.box.height * scaleY) + 'px">' +
          '<span class="tag">' + esc(label) + '</span></div>';
      }).join('');
    };
    if (img.complete && img.naturalWidth) doPaint();
    else { img.addEventListener('load', doPaint, { once: true }); requestAnimationFrame(doPaint); }
  }

  async function runRecognition() {
    const r = Ui.recog;
    if (!r.dataUrl) return;
    if (!Engine.isReady()) { toast('ابتدا موتور را فعال کنید.', 'warn'); return; }
    if (r.busy) return;
    r.busy = true;
    const btn = document.getElementById('btnRecogRun');
    const out = document.getElementById('recogResult');
    if (btn) { btn.disabled = true; btn.innerHTML = icon('i-target') + ' در حال پردازش…'; }
    if (out) out.innerHTML = '<div class="card"><div class="row" style="gap:9px"><span class="spinner"></span><span class="grow" style="font-size:.8rem">تشخیص چهره و استخراج ویژگی…</span></div>' + progressBar(60, true) + '</div>';
    try {
      const imgEl = await Images.loadImage(r.dataUrl);
      const res = await Engine.enqueue(() => Engine.analyze(imgEl, { inputSize: 416 }));
      if (!res.ok) {
        r.result = { error: res };
        await Stats.bump('matchesFail');
        await Logs.add('error', 'خطای پردازش تصویر شناسایی: ' + res.title, 'error');
      } else {
        const faces = res.faces.map((f) => {
          const matches = Records.match(f.descriptor, Settings.data.threshold);
          return Object.assign({}, f, { match: matches[0] || null, alternatives: matches.slice(1, 4) });
        });
        const accepted = faces.filter((f) => f.match && f.match.accepted);
        r.result = { faces: faces, ms: res.ms, detected: faces.length, size: res.size, accepted: accepted.length, at: Date.now() };
        if (accepted.length) await Stats.bump('matchesOk', accepted.length);
        if (faces.length - accepted.length > 0) await Stats.bump('matchesFail', faces.length - accepted.length);
        await Stats.bump('totalComputeMs', res.ms);
        await Logs.add('match_result',
          'شناسایی: ' + faces.length + ' چهره، ' + accepted.length + ' تطبیق مطمئن، زمان ' + res.ms + 'ms', accepted.length ? 'success' : 'warn');
        await Stats.bump('operations');
      }
      r.busy = false;
      paintRecogResult();
      paintOverlay(r.result);
    } catch (e) {
      r.busy = false;
      toast('پردازش ناموفق بود: ' + (e.message || ''), 'error');
      if (out) out.innerHTML = '';
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('i-target') + ' پردازش و شناسایی'; }
    }
  }

  function paintRecogResult() {
    const out = document.getElementById('recogResult');
    if (!out) return;
    const r = Ui.recog.result;
    if (!r) { out.innerHTML = ''; return; }
    if (r.error) {
      out.innerHTML = '<div class="card"><div class="alert danger">' + icon('i-warn') + '<div><b>' + esc(r.error.title) + '</b><br>' + esc(r.error.message) +
        (r.error.technical ? '<div class="hint" style="direction:ltr;text-align:left;margin-top:6px">' + esc(r.error.technical.slice(0, 200)) + '</div>' : '') + '</div></div>' +
        '<div class="btn-row" style="margin-top:12px"><button class="btn primary" type="button" data-act="recog-run">تلاش مجدد</button>' +
        '<button class="btn ghost" type="button" data-act="recog-pick">تصویر دیگر</button></div></div>';
      return;
    }
    const head = '<div class="card"><div class="card-head"><h2 class="card-title">نتیجه شناسایی</h2>' +
      '<span class="chip ' + (r.accepted ? 'success' : 'warn') + '">' + icon(r.accepted ? 'i-check' : 'i-warn') + ' ' +
      faNum(r.accepted) + ' تطبیق مطمئن</span></div>' +
      '<div class="kv"><span>تعداد چهره‌های یافت‌شده</span><b>' + faNum(r.detected) + '</b></div>' +
      '<div class="kv"><span>زمان پردازش</span><b>' + fmtMs(r.ms) + '</b></div>' +
      '<div class="kv"><span>ابعاد پردازش‌شده</span><b class="mono">' + faNum(r.size.w) + '×' + faNum(r.size.h) + '</b></div>' +
      '<div class="kv"><span>آستانه تطبیق</span><b>' + esc(Engine.thresholdLabel(Settings.data.threshold)) + ' (' + esc(faNum(Settings.data.threshold.toFixed(2))) + ')</b></div>' +
      '</div>';
    if (!r.faces.length) {
      out.innerHTML = head + '<div class="card"><div class="alert warn">' + icon('i-warn') + '<div><b>چهره‌ای پیدا نشد.</b><br>دلایل رایج: چهره کوچک یا خارج از کادر، تاری تصویر، زاویه زیاد، یا تصویر غیرواقعی. تصویر واضح‌تری با چهره رو به دوربین امتحان کنید.</div></div>' +
        '<div class="btn-row" style="margin-top:12px"><button class="btn primary" type="button" data-act="recog-pick">تصویر دیگر</button></div></div>';
      return;
    }
    const cards = r.faces.map((f, i) => {
      const m = f.match;
      if (!m) {
        return '<div class="card"><div class="card-head"><h2 class="card-title">چهره ' + faNum(i + 1) + '</h2><span class="chip">بدون پرونده</span></div>' +
          '<div class="alert info">' + icon('i-info') + '<div>هیچ پرونده‌ای دارای بردار ویژگی نیست؛ تطبیق ممکن نیست. ابتدا پرونده‌ها را با موتور فعال پردازش کنید.</div></div></div>';
      }
      const ok = m.accepted;
      const rec = m.record;
      const sim = Engine.similarityPercent(m.distance);
      const alts = (f.alternatives || []).filter((a) => a.distance !== m.distance).slice(0, 2);
      const verdict = ok ? 'تطبیق مطمئن' : (m.withinThreshold && m.ambiguous ? 'ابهام بین دو پرونده' : 'تطبیق نامطمئن');
      return '<div class="card">' +
        '<div class="card-head"><h2 class="card-title">چهره ' + faNum(i + 1) + '<small>اطمینان تشخیص: ' + esc(faNum((f.score * 100).toFixed(0))) + '٪</small></h2>' +
        '<span class="chip ' + (ok ? 'success' : 'warn') + '">' + verdict + '</span></div>' +
        (!ok && m.withinThreshold && m.ambiguous
          ? '<div class="alert warn">' + icon('i-warn') + '<div><b>دو پرونده با فاصله بسیار نزدیک.</b><br>نزدیک‌ترین نتیجه «' + esc(rec ? Records.name(rec) : '—') + '» است اما پرونده دیگری فاصله‌ای تقریباً برابر دارد؛ برای پرهیز از اعلام هویت اشتباه، نتیجه قطعی اعلام نمی‌شود.</div></div>'
          : '') +
        (ok && rec
          ? '<div class="row" style="gap:12px;align-items:center"><div class="rec-avatar" style="width:58px;height:58px">' + icon('i-users') + '</div>' +
            '<div class="grow"><div class="rec-name">' + esc(Records.name(rec)) + '</div><div class="rec-meta">شناسه <span class="mono">' + esc(rec.id) + '</span></div></div>' +
            '<button class="btn sm" type="button" data-open-record="' + esc(rec.id) + '">مشاهده</button></div>'
          : (m.withinThreshold && m.ambiguous ? '' : '<div class="alert warn">' + icon('i-warn') + '<div><b>هویت اعلام نمی‌شود.</b><br>نزدیک‌ترین شباهت از آستانه تعیین‌شده بیشتر است. این به معنای «تطبیق قطعی» نیست؛ نتیجه را با شواهد دیگر بررسی کنید.</div></div>')) +
        '<div class="kv"><span>فاصله تطبیق (اقلیدسی)</span><b class="mono">' + esc(fmtDistance(m.distance)) + '</b></div>' +
        '<div class="kv"><span>شاخص شباهت (نمایشی)</span><b>' + esc(faNum(sim)) + '٪</b></div>' +
        '<div class="kv"><span>آستانه</span><b class="mono">' + esc(faNum(Settings.data.threshold.toFixed(2))) + '</b></div>' +
        '<div class="progress" style="margin-top:8px"><i style="width:' + CB.clamp(100 - Math.round(m.distance * 100), 2, 100) + '%"></i></div>' +
        '<div class="hint" style="margin-top:8px">شاخص شباهت فقط برای نمایش است و احتمال قطعی هویت نیست. مقدار اصلی تصمیم، «فاصله» است؛ کمتر بودن آن یعنی شباهت بیشتر.</div>' +
        (alts.length ? '<div class="divider"></div><div class="hint">گزینه‌های بعدی: ' +
          alts.map((a) => esc(a.record ? Records.name(a.record) : '—') + ' (' + fmtDistance(a.distance) + ')').join(' · ') + '</div>' : '') +
        '</div>';
    }).join('');
    out.innerHTML = head + cards +
      '<div class="btn-row stretch"><button class="btn primary" type="button" data-act="recog-pick">تصویر دیگر</button>' +
      '<button class="btn ghost" type="button" data-act="recog-run">پردازش مجدد</button></div>';
  }

  /* ============================================================
     مسیریابی
     ============================================================ */
  const Router = {
    go(route, params) {
      if (!ROUTES.includes(route)) route = 'dashboard';
      Ui.route = route;
      Ui.params = params || {};
      if (route !== 'record-form') { /* حفظ فرم فقط در همان صفحه */ }
      if (route === 'record-detail' && Ui.params.id) Ui.detail.id = Ui.params.id;
      if (route !== 'camera' && window.CB.Camera && CB.Camera.active) CB.Camera.stop(true);
      const hash = '#' + route + (route === 'record-detail' && Ui.params.id ? '/' + Ui.params.id : '');
      if (location.hash !== hash) history.replaceState(null, '', hash);
      this.render();
      window.scrollTo({ top: 0, behavior: Settings.data.anim ? 'smooth' : 'auto' });
    },
    render() {
      if (!Ui.view) return;
      const r = Ui.route;
      Ui.view.classList.remove('view-enter');
      void Ui.view.offsetWidth;
      CB.$$('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.nav === r ||
        (r === 'record-form' || r === 'record-detail') && b.dataset.nav === 'records'));
      switch (r) {
        case 'records': renderRecords(); break;
        case 'recognize': renderRecognize(); break;
        case 'camera': CB.renderCamera(Ui.view); break;
        case 'more': CB.renderMore(); break;
        case 'record-form': renderRecordForm(); break;
        case 'record-detail': renderRecordDetail(); break;
        case 'settings': CB.renderSettings(); break;
        case 'appearance': CB.renderAppearance(); break;
        case 'backup': CB.renderBackup(); break;
        case 'logs': CB.renderLogs(); break;
        case 'assistant': CB.renderAssistant(); break;
        case 'help': CB.renderHelp(); break;
        case 'privacy': CB.renderPrivacy(); break;
        case 'about': CB.renderAbout(); break;
        default: renderDashboard();
      }
    },
    init() {
      Ui.view = document.getElementById('view');
      Ui.nav = document.querySelector('.tabbar');
      CB.$$('.tab-btn').forEach((b) => b.addEventListener('click', () => {
        Ui.form = { recordId: null, images: [], busy: false };
        this.go(b.dataset.nav);
      }));
      window.addEventListener('hashchange', () => {
        const parts = location.hash.replace('#', '').split('/');
        if (parts[0] && ROUTES.includes(parts[0]) && parts[0] !== Ui.route) this.go(parts[0], { id: parts[1] });
      });
      const initial = location.hash.replace('#', '').split('/');
      this.go(ROUTES.includes(initial[0]) ? initial[0] : 'dashboard', { id: initial[1] });
    }
  };

  CB.Ui = Ui;
  CB.Router = Router;
  CB.Net = Net;
  CB.pickFiles = pickFiles;
  CB.pageHead = pageHead;
  CB.statCard = statCard;
  CB.emptyBox = emptyBox;
  CB.progressBar = progressBar;
  CB.statusChip = statusChip;
  CB.activateEngine = activateEngine;
  CB.paintEngineBlock = paintEngineBlock;
  CB.addFilesToForm = addFilesToForm;
  CB.renderFormThumbs = renderFormThumbs;
  CB.renderExistingThumbs = renderExistingThumbs;
  CB.saveRecordForm = saveRecordForm;
  CB.runRecognition = runRecognition;
  CB.paintRecogResult = paintRecogResult;
  CB.paintOverlay = paintOverlay;
})();
/* ============================================================
   ماژول ۵: دوربین، تنظیمات، ظاهر، پشتیبان‌گیری، گزارش‌ها، دستیار، راهنما، حریم خصوصی
   ============================================================ */
(function () {
  'use strict';
  const CB = window.CB;
  const { $, $$, esc, icon, fmtInt, fmtDate, fmtBytes, fmtMs, fmtDistance, faNum, toast, Modal, Settings, Records, Engine, Images, DB, Logs, Stats, Ui } = CB;

  /* ============================================================
     دوربین
     ============================================================ */
  const Camera = {
    active: false,
    stream: null,
    facing: 'user',
    live: false,
    liveTimer: null,
    busy: false,
    lastResult: null,
    shot: null,
    error: null,
    overlay: null,

    supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); },

    explainError(err) {
      const name = (err && err.name) || 'Unknown';
      if (location.protocol === 'file:') {
        return { title: 'اجرای برنامه از فایل محلی', message: 'مرورگرها دسترسی دوربین را برای آدرس‌های file:// مسدود می‌کنند. برنامه را از طریق HTTPS (مثلاً GitHub Pages) یا http://localhost باز کنید.' };
      }
      if (!window.isSecureContext) {
        return { title: 'اتصال امن برقرار نیست', message: 'getUserMedia فقط در HTTPS یا localhost فعال است. سایت را با https باز کنید.' };
      }
      const map = {
        NotAllowedError: { title: 'مجوز دوربین رد شد', message: 'از آیکون قفل کنار آدرس سایت، مجوز دوربین را روی «اجازه» بگذارید و صفحه را دوباره بارگذاری کنید.' },
        PermissionDeniedError: { title: 'مجوز دوربین رد شد', message: 'دسترسی دوربین در تنظیمات مرورگر مسدود شده است.' },
        NotFoundError: { title: 'دوربینی پیدا نشد', message: 'دستگاه دوربین در دسترس نیست. دوربین دیگری را امتحان کنید.' },
        DevicesNotFoundError: { title: 'دوربینی پیدا نشد', message: 'دستگاه دوربین در دسترس نیست.' },
        NotReadableError: { title: 'دوربین در حال استفاده است', message: 'برنامه دیگری (مثلاً تماس تصویری) از دوربین استفاده می‌کند. آن را ببندید و تلاش کنید.' },
        TrackStartError: { title: 'دوربین در حال استفاده است', message: 'راه‌اندازی جریان تصویر ممکن نشد.' },
        OverconstrainedError: { title: 'تنظیمات دوربین پشتیبانی نمی‌شود', message: 'دوربین دیگری را انتخاب کنید.' },
        SecurityError: { title: 'دسترسی مسدود است', message: 'سیاست امنیتی مرورگر اجازه دسترسی به دوربین را نمی‌دهد.' }
      };
      return map[name] || { title: 'خطای دوربین (' + name + ')', message: (err && err.message) || 'علت خطا مشخص نیست.' };
    },

    async start(facing) {
      this.error = null;
      if (!this.supported()) {
        this.error = { title: 'دوربین پشتیبانی نمی‌شود', message: 'مرورگر شما getUserMedia را ارائه نمی‌دهد. Chrome اندروید را به‌روزرسانی کنید.' };
        return { ok: false, error: this.error };
      }
      this.stop(true);
      const want = facing || Settings.data.cameraFacing || 'user';
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: want }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        this.facing = want;
        this.active = true;
        Settings.data.cameraFacing = want;
        Settings.save();
        await Logs.add('camera', 'دوربین راه‌اندازی شد (' + (want === 'user' ? 'جلو' : 'عقب') + ')', 'info');
        return { ok: true };
      } catch (e) {
        this.error = this.explainError(e);
        await Logs.add('camera', 'خطای دوربین: ' + this.error.title, 'error');
        await Stats.bump('operations');
        return { ok: false, error: this.error };
      }
    },

    attach(videoEl) {
      if (!videoEl) return;
      if (this.stream) {
        videoEl.srcObject = this.stream;
        videoEl.play().catch(() => {});
      }
    },

    stop(silent) {
      this.live = false;
      if (this.liveTimer) { clearInterval(this.liveTimer); this.liveTimer = null; }
      if (this.stream) {
        this.stream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
        this.stream = null;
      }
      const was = this.active;
      this.active = false;
      this.busy = false;
      if (this.overlay) { const c = this.overlay.getContext('2d'); if (c) c.clearRect(0, 0, this.overlay.width, this.overlay.height); }
      if (was && !silent) toast('دوربین متوقف شد.', 'info', 2200);
    },

    async switchCamera() {
      const next = this.facing === 'user' ? 'environment' : 'user';
      const res = await this.start(next);
      if (res.ok) { CB.Router.render(); toast('دوربین ' + (next === 'user' ? 'جلو' : 'عقب') + ' فعال شد.', 'success'); }
      else { CB.Router.render(); toast(res.error.title + ' — ' + res.error.message, 'error', 6000); }
    },

    grabFrame(videoEl, maxEdge) {
      const limit = maxEdge || 720;
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      if (!vw || !vh) return null;
      const scale = Math.min(1, limit / Math.max(vw, vh));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vw * scale);
      canvas.height = Math.round(vh * scale);
      const ctx = canvas.getContext('2d');
      if (this.facing === 'user' && Settings.data.mirror) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const url = canvas.toDataURL('image/jpeg', 0.86);
      canvas.width = canvas.height = 0;
      return url;
    },

    async takeShot() {
      const video = document.getElementById('camVideo');
      if (!video || !this.active) { toast('دوربین فعال نیست.', 'warn'); return; }
      const url = this.grabFrame(video, 900);
      if (!url) { toast('تصویر دوربین آماده نیست. کمی صبر کنید.', 'warn'); return; }
      this.shot = url;
      CB.Router.render();
      await this.processShot(url);
    },

    async processShot(url) {
      if (!Engine.isReady()) { toast('برای پردازش، ابتدا موتور را فعال کنید.', 'warn'); return; }
      if (this.busy) return;
      this.busy = true;
      const out = document.getElementById('camResult');
      if (out) out.innerHTML = '<div class="card"><div class="row" style="gap:9px"><span class="spinner"></span><span class="grow" style="font-size:.8rem">پردازش فریم دوربین…</span></div></div>';
      try {
        const imgEl = await Images.loadImage(url);
        const res = await Engine.enqueue(() => Engine.analyze(imgEl, { inputSize: 416 }));
        if (!res.ok) {
          this.lastResult = { error: res, at: Date.now() };
        } else {
          const faces = res.faces.map((f) => {
            const matches = Records.match(f.descriptor, Settings.data.threshold);
            return Object.assign({}, f, { match: matches[0] || null });
          });
          const accepted = faces.filter((f) => f.match && f.match.accepted);
          if (accepted.length) await Stats.bump('matchesOk', accepted.length);
          if (faces.length - accepted.length) await Stats.bump('matchesFail', faces.length - accepted.length);
          this.lastResult = { faces: faces, ms: res.ms, detected: faces.length, accepted: accepted.length, at: Date.now(), size: res.size };
          await Logs.add('match_result', 'پردازش دوربین: ' + faces.length + ' چهره، ' + accepted.length + ' تطبیق مطمئن', accepted.length ? 'success' : 'info');
        }
        await Stats.bump('operations');
      } catch (e) {
        this.lastResult = { error: { title: 'خطای پردازش', message: e.message || '' }, at: Date.now() };
      }
      this.busy = false;
      CB.Router.render();
    },

    toggleLive() {
      if (this.live) {
        clearInterval(this.liveTimer);
        this.liveTimer = null;
        this.live = false;
        toast('حالت زنده متوقف شد.', 'info');
        CB.Router.render();
        return;
      }
      if (!Engine.isReady()) { toast('حالت زنده نیازمند موتور فعال است.', 'warn'); return; }
      this.live = true;
      this.liveTimer = setInterval(async () => {
        if (!this.active || !this.live || this.busy) return;
        const video = document.getElementById('camVideo');
        if (!video || video.readyState < 2) return;
        const url = this.grabFrame(video, 360);
        if (!url) return;
        this.busy = true;
        try {
          const imgEl = await Images.loadImage(url);
          const res = await Engine.enqueue(() => Engine.analyze(imgEl, { inputSize: 224 }));
          if (res.ok) {
            const faces = res.faces.map((f) => {
              const matches = Records.match(f.descriptor, Settings.data.threshold);
              return Object.assign({}, f, { match: matches[0] || null });
            });
            this.lastResult = { faces: faces, ms: res.ms, detected: faces.length, accepted: faces.filter((f) => f.match && f.match.accepted).length, live: true };
            this.paintLiveBoxes(faces, video);
          }
        } catch (e) { /* در حالت زنده خطاها بی‌صدا نادیده گرفته می‌شوند */ }
        this.busy = false;
        const status = document.getElementById('camLiveStatus');
        if (status && this.lastResult) {
          status.textContent = 'آخرین فریم: ' + faNum(this.lastResult.detected || 0) + ' چهره · ' + faNum(this.lastResult.accepted || 0) + ' تطبیق · ' + fmtMs(this.lastResult.ms || 0);
        }
        const list = document.getElementById('camLiveList');
        if (list && this.lastResult) {
          list.innerHTML = (this.lastResult.faces || []).map((f) => {
            const name = f.match && f.match.accepted && f.match.record ? Records.name(f.match.record) : 'ناشناس';
            const ok = !!(f.match && f.match.accepted);
            return '<span class="chip ' + (ok ? 'success' : '') + '">' + icon(ok ? 'i-check' : 'i-help') + ' ' + esc(name) +
              (f.match ? ' · ' + esc(fmtDistance(f.match.distance)) : '') + '</span>';
          }).join('');
        }
      }, 2200);
      CB.Router.render();
    },

    paintLiveBoxes(faces, video) {
      const canvas = document.getElementById('camOverlay');
      if (!canvas) return;
      this.overlay = canvas;
      const rect = video.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
      const sx = rect.width / vw, sy = rect.height / vh;
      const mirrored = this.facing === 'user' && Settings.data.mirror;
      faces.forEach((f) => {
        const x = mirrored ? (vw - f.box.x - f.box.width) * sx : f.box.x * sx;
        const y = f.box.y * sy, w = f.box.width * sx, h = f.box.height * sy;
        const ok = !!(f.match && f.match.accepted);
        ctx.strokeStyle = ok ? '#22c55e' : '#f59e0b';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        const label = ok && f.match.record ? Records.name(f.match.record) : 'ناشناس';
        ctx.font = '600 12px Vazirmatn, sans-serif';
        const tw = ctx.measureText(label).width + 10;
        ctx.fillStyle = ok ? '#22c55e' : '#f59e0b';
        ctx.fillRect(x, Math.max(0, y - 18), tw, 18);
        ctx.fillStyle = '#04121d';
        ctx.fillText(label, x + 5, Math.max(13, y - 5));
      });
    }
  };

  function downloadBlob(content, fileName, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  async function exportBackup() {
    if (!DB.available) { toast('ذخیره‌سازی پایدار در دسترس نیست؛ خروجی کامل ممکن نیست.', 'error', 6000); return; }
    toast('در حال ساخت فایل پشتیبان…', 'info', 2000);
    try {
      const payload = await Records.exportAll();
      const json = JSON.stringify(payload);
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      downloadBlob(json, 'chehrehban-backup-' + stamp + '.json', 'application/json;charset=utf-8');
      await Logs.add('backup_export', 'خروجی پشتیبان: ' + fmtInt(payload.records.length) + ' پرونده، ' + fmtInt(payload.images.length) + ' تصویر', 'success');
      await Stats.bump('operations');
      toast('فایل پشتیبان ساخته و دانلود شد.', 'success');
    } catch (e) {
      toast('ساخت پشتیبان ناموفق بود: ' + (e.message || ''), 'error', 6000);
    }
  }

  function importBackupFlow() {
    const input = document.getElementById('jsonInput');
    input.value = '';
    const handler = async () => {
      input.removeEventListener('change', handler);
      const file = (input.files || [])[0];
      if (!file) return;
      if (file.size > 200 * 1024 * 1024) { toast('حجم فایل پشتیبان بیش از حد مجاز (۲۰۰ مگابایت) است.', 'error'); return; }
      const text = await file.text();
      const v = Records.validateBackup(text);
      const area = document.getElementById('importArea');
      if (!v.ok) {
        if (area) area.innerHTML = '<div class="alert danger">' + icon('i-x') + '<div><b>فایل معتبر نیست.</b><br>' + esc(v.message) + '</div></div>';
        toast('فایل پشتیبان معتبر نیست: ' + v.message, 'error', 7000);
        return;
      }
      const s = v.summary;
      if (area) {
        area.innerHTML = '<div class="alert info">' + icon('i-info') + '<div><b>فایل معتبر است.</b><br>' +
          fmtInt(s.records) + ' پرونده · ' + fmtInt(s.images) + ' تصویر · ' + fmtInt(s.faces) + ' بردار ویژگی' +
          (s.skippedFaces ? '<br>حذف‌شده: ' + faNum(s.skippedFaces) + ' بردار نامعتبر' : '') +
          (s.exportedAt ? '<br>تاریخ خروجی: ' + esc(fmtDate(Date.parse(s.exportedAt))) : '') + '</div></div>' +
          '<div class="btn-row stretch" style="margin-top:10px"><button class="btn danger" type="button" data-act="confirm-import">جایگزینی داده‌ها</button>' +
          '<button class="btn ghost" type="button" data-act="cancel-import">لغو</button></div>';
      }
      CB.pendingImport = v;
    };
    input.addEventListener('change', handler);
    input.click();
  }

  async function confirmImport() {
    const v = CB.pendingImport;
    if (!v || !v.ok) { toast('ابتدا فایل پشتیبان را انتخاب کنید.', 'warn'); return; }
    const ok = await Modal.confirm({
      title: 'جایگزینی همه داده‌ها',
      message: 'همه پرونده‌ها و تصاویر فعلی حذف و با محتوای فایل پشتیبان جایگزین می‌شوند (' +
        fmtInt(v.summary.records) + ' پرونده). این عملیات قابل بازگشت نیست. ادامه می‌دهید؟',
      variant: 'danger', confirmLabel: 'بله، جایگزین کن'
    });
    if (!ok) return;
    try {
      const res = await Records.importAll(v.data);
      if (!res.ok) throw new Error(res.message);
      if (v.data.settings && typeof v.data.settings === 'object') {
        Settings.data = Object.assign({}, CB.SETTINGS_DEFAULTS, v.data.settings);
        if (!CB.THEMES.some((t) => t.id === Settings.data.theme)) Settings.data.theme = 'midnight';
        Settings.save();
        applyAll();
      }
      await Logs.add('backup_import', 'بازیابی پشتیبان: ' + fmtInt(v.summary.records) + ' پرونده', 'success');
      await Stats.bump('operations');
      CB.pendingImport = null;
      toast('داده‌ها با موفقیت بازیابی شدند.', 'success');
      CB.Router.go('records');
    } catch (e) {
      toast('بازیابی ناموفق بود: ' + (e.message || ''), 'error', 7000);
    }
  }

  function renderLogList() {
    const box = document.getElementById('logList');
    if (!box) return;
    const entries = Logs.list(logFilter);
    const counter = document.getElementById('logCount');
    if (counter) counter.textContent = fmtInt(entries.length) + ' رویداد';
    if (!entries.length) {
      box.innerHTML = CB.emptyBox('i-clock', 'گزارشی وجود ندارد', 'رویدادهای برنامه به‌صورت خودکار اینجا ثبت می‌شوند.');
      return;
    }
    box.innerHTML = '<div class="card"><div class="list">' + entries.slice(0, 200).map((e) =>
      '<div class="list-item"><div class="li-ico">' + icon(e.level === 'error' ? 'i-x' : e.level === 'warn' ? 'i-warn' : e.level === 'success' ? 'i-check' : 'i-info') + '</div>' +
      '<div class="li-main"><div class="li-title">' + esc(e.message) + '</div>' +
      '<div class="li-sub">' + esc(CB.LOG_TYPES[e.type] || e.type) + ' · ' + esc(fmtDate(e.ts)) + '</div></div></div>').join('') + '</div></div>';
  }

  function exportLogs(format) {
    const entries = Logs.list(logFilter);
    if (!entries.length) { toast('گزارشی برای خروجی وجود ندارد.', 'warn'); return; }
    if (format === 'csv') {
      const rows = [['تاریخ', 'نوع', 'سطح', 'پیام']].concat(entries.map((e) => [
        new Date(e.ts).toISOString(), CB.LOG_TYPES[e.type] || e.type, e.level, String(e.message).replace(/"/g, '""')
      ]));
      const csv = '\ufeff' + rows.map((r) => r.map((c) => '"' + c + '"').join(',')).join('\n');
      downloadBlob(csv, 'chehrehban-logs.csv', 'text/csv;charset=utf-8');
    } else {
      downloadBlob(JSON.stringify(entries, null, 2), 'chehrehban-logs.json');
    }
    toast('خروجی گزارش‌ها ساخته شد.', 'success');
  }

  const Chat = { messages: [] };
  function assistantReply(text) {
    const q = CB.normalizeText(text);
    let best = null, bestScore = 0;
    ASSISTANT_KB.forEach((item) => {
      let score = 0;
      item.keys.forEach((k) => { if (q.includes(CB.normalizeText(k))) score += 1; });
      if (score > bestScore) { bestScore = score; best = item; }
    });
    if (best && bestScore > 0) return best.answer;
    return 'پاسخ دقیقی برای این پرسش در راهنمای محلی پیدا نکردم. می‌توانید از موضوعات زیر استفاده کنید:\n• ثبت پرونده\n• شناسایی چهره\n• فعال‌سازی و عیب‌یابی موتور\n• دوربین و مجوز دسترسی\n• ذخیره‌سازی و پشتیبان‌گیری\n• آستانه تطبیق و دقت\n• حریم خصوصی\n\nتوجه: این دستیار در نسخه فعلی کاملاً محلی و قاعده‌محور است و به مدل زبانی آنلاین متصل نیست.';

  function paintChat() {
    const box = document.getElementById('chatBox');
    if (!box) return;
    box.innerHTML = Chat.messages.map((m) => '<div class="msg ' + (m.role === 'user' ? 'user' : 'bot') + '">' + esc(m.text) + '</div>').join('');
    box.scrollTop = box.scrollHeight;
  }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    Chat.messages.push({ role: 'user', text: text });
    paintChat();
    let answer;
    if (CB.Assistant && typeof CB.Assistant.remote === 'function') {
      answer = await CB.Assistant.remote(text);
    } else {
      await CB.sleep(220);
      answer = assistantReply(text);
    }
    Chat.messages.push({ role: 'bot', text: answer });
    paintChat();
  }

  CB.Assistant = {
    remote: null,
    setRemote(fn) { this.remote = typeof fn === 'function' ? fn : null; },
    ask(text) { return assistantReply(text); }
  };

  /* ---------- رویدادهای عمومی ---------- */
  function bindGlobalEvents() {
    document.addEventListener('click', async (ev) => {
      const nav = ev.target.closest('[data-nav]');
      if (nav) return;

      const actEl = ev.target.closest('[data-act]');
      if (actEl) {
        const act = actEl.dataset.act;
        if (Actions[act]) {
          ev.preventDefault();
          if (actEl.disabled) return;
          try { await Actions[act](); }
          catch (e) {
            toast('خطا در اجرای عملیات: ' + (e.message || ''), 'error', 6000);
            Logs.add('error', 'خطای عملیات ' + act + ': ' + (e.message || ''), 'error');
          }
        }
        return;
      }

      const openRec = ev.target.closest('[data-open-record]');
      if (openRec) { Router.go('record-detail', { id: openRec.dataset.openRecord }); return; }

      const statusChip = ev.target.closest('[data-filter-status]');
      if (statusChip) { Ui.filters.status = statusChip.dataset.filterStatus; Router.render(); return; }

      const rmExisting = ev.target.closest('[data-remove-existing]');
      if (rmExisting) {
        const id = rmExisting.dataset.removeExisting;
        const ok = await Modal.confirm({ title: 'حذف تصویر', variant: 'danger', message: 'این تصویر و بردارهای ویژگی آن حذف می‌شود.', confirmLabel: 'حذف' });
        if (!ok) return;
        await Records.removeImage(Ui.form.recordId, id);
        await CB.renderExistingThumbs((Records.get(Ui.form.recordId) || {}).imageIds || []);
        CB.renderFormThumbs();
        toast('تصویر حذف شد.', 'success');
        return;
      }
      const rmNew = ev.target.closest('[data-remove-new]');
      if (rmNew) {
        Ui.form.images.splice(Number(rmNew.dataset.removeNew), 1);
        CB.renderFormThumbs();
        return;
      }
      const reproc = ev.target.closest('[data-reprocess]');
      if (reproc) { await reprocessImage(reproc.dataset.reprocess); return; }
      const rmImage = ev.target.closest('[data-remove-image]');
      if (rmImage) {
        const ok = await Modal.confirm({ title: 'حذف تصویر', variant: 'danger', message: 'این تصویر و بردارهای ویژگی آن حذف می‌شود.', confirmLabel: 'حذف' });
        if (!ok) return;
        await Records.removeImage(Ui.detail.id, rmImage.dataset.removeImage);
        toast('تصویر حذف شد.', 'success');
        Router.render();
        return;
      }
      const toggle = ev.target.closest('[data-toggle]');
      if (toggle) {
        const key = toggle.dataset.toggle;
        const next = !Settings.data[key];
        Settings.set(key, next);
        toggle.setAttribute('aria-checked', String(next));
        if (key === 'anim' || key === 'showBoxes') { CB.FX.sync(); }
        return;
      }
    });

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        const card = ev.target.closest && ev.target.closest('[data-open-record]');
        if (card && ev.target === card) { ev.preventDefault(); Router.go('record-detail', { id: card.dataset.openRecord }); }
      }

    document.getElementById('btnMode').addEventListener('click', () => {
      Settings.set('mode', Settings.data.mode === 'dark' ? 'light' : 'dark');
      toast(Settings.data.mode === 'dark' ? 'حالت تاریک فعال شد.' : 'حالت روشن فعال شد.', 'info', 1800);

    window.addEventListener('resize', CB.debounce(() => {

    }, 220));
    window.addEventListener('pagehide', () => Camera.stop(true));

  async function reprocessImage(imageId) {
    if (!Engine.isReady()) { toast('ابتدا موتور را فعال کنید.', 'warn'); return; }
    const rec = Records.get(Ui.detail.id) || Records.get(Ui.form.recordId);
    if (!rec) return;
    const img = await Images.get(imageId);
    if (!img) { toast('تصویر پیدا نشد.', 'error'); return; }
    toast('در حال بازپردازش تصویر…', 'info', 2000);
    try {
      const imgEl = await Images.loadImage(img.dataUrl);
      const res = await Engine.enqueue(() => Engine.analyze(imgEl, { inputSize: 416 }));
      if (!res.ok) { toast(res.title + ' — ' + res.message, 'error', 5500); return; }
      const r = await Records.reprocessImage(rec.id, imageId, res.faces, res.ms);
      if (r.ok) toast('بازپردازش موفق: ' + CB.faNum(r.faces) + ' بردار ویژگی', 'success');
      else toast(r.message || 'بازپردازش ناموفق بود.', 'warn', 5000);
      Router.render();
    } catch (e) {
      toast('بازپردازش ناموفق: ' + (e.message || ''), 'error');
    }
  }

  /* ---------- Service Worker (اختیاری، برای آفلاین) ---------- */
  async function registerServiceWorker() {
    CB.offlineCache = false;
    if (!('serviceWorker' in navigator)) {
      CB.offlineCacheReason = 'مرورگر Service Worker را پشتیبانی نمی‌کند.';
      return;
    }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'http:') {
      CB.offlineCacheReason = 'اجرای برنامه از پروتکل ناامن؛ کش آفلاین فعال نمی‌شود.';
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      CB.offlineCache = true;
      CB.offlineCacheReason = 'فعال — منابع پس از اولین بارگذاری کش می‌شوند.';
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    } catch (e) {
      CB.offlineCache = false;
      CB.offlineCacheReason = 'فایل sw.js در کنار index.html پیدا نشد؛ کش آفلاین غیرفعال است (عملکرد اصلی برنامه مستقل است).';
    }
  }

    if (!dbOk) {
      const view = document.getElementById('view');
      if (view) {
        view.insertAdjacentHTML('afterbegin', '<div class="alert danger" style="margin-bottom:14px">' + icon('i-warn') +
          '<div><b>ذخیره‌سازی در دسترس نیست.</b><br>' + esc(DB.error || '') + '<br>احتمالاً حالت ناشناس (Incognito) فعال است یا مرورگر IndexedDB را مسدود کرده. ثبت پرونده ممکن نیست؛ اما رابط کاربری و راهنما در دسترس‌اند.</div></div>');
      }
    }

    CB.bootInfo = { bootMs: Math.round(performance.now() - t0), db: dbOk };
    if (Settings.data.autoActivate && !Engine.isReady() && navigator.onLine) {
      setTimeout(() => { CB.activateEngine(); }, 900);
    }
    Logs.add('settings', 'برنامه راه‌اندازی شد (نسخه ' + CB.APP.version + '، بک‌اند ذخیره‌سازی: ' + (dbOk ? 'IndexedDB' : 'غیرفعال') + ')', 'info');
  }

  /* ---------- مدیریت خطاهای عمومی ---------- */
  window.addEventListener('error', (ev) => {
    const msg = ev.message || 'خطای اجرای اسکریپت';
    if (window.CB && CB.Logs) CB.Logs.add('error', 'خطای عمومی: ' + msg.slice(0, 160), 'error');
  });
  window.addEventListener('unhandledrejection', (ev) => {
    const r = ev.reason;
    const msg = (r && (r.message || r.toString())) || 'Promise رد شد';
    if (window.CB && CB.Logs) CB.Logs.add('error', 'خطای پردازش نشده: ' + String(msg).slice(0, 160), 'error');
  });

  CB.Actions = Actions;
  CB.reprocessImage = reprocessImage;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
