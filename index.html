<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="midnight" data-mode="dark" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b1020" id="metaThemeColor">
<meta name="description" content="چهره‌بان هوشمند — سامانه محلی تشخیص و تطبیق چهره با موتور واقعی هوش مصنوعی، اجرای کامل در مرورگر و ذخیره‌سازی روی دستگاه.">
<meta name="color-scheme" content="dark light">
<title>چهره‌بان هوشمند | CHEHREHBAN AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f172a'/%3E%3Cpath d='M32 12c8 0 14 6 14 14v6c0 10-6 18-14 20-8-2-14-10-14-20v-6c0-8 6-14 14-14z' fill='none' stroke='%2338bdf8' stroke-width='3'/%3E%3Ccircle cx='26' cy='27' r='2.6' fill='%2338bdf8'/%3E%3Ccircle cx='38' cy='27' r='2.6' fill='%2338bdf8'/%3E%3Cpath d='M26 37c4 3 8 3 12 0' stroke='%2322c55e' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" media="all" onerror="this.remove()">
<style>
/* ============================================================
   CHEHREHBAN AI — Design System
   لایه ۱: توکن‌ها و بازنشانی
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  /* اندازه و فاصله — با تنظیمات کاربر تغییر می‌کند */
  --fs-base:15px;
  --gap:14px;
  --card-pad:18px;
  --radius-xl:26px;
  --radius-lg:20px;
  --radius:15px;
  --radius-sm:11px;
  --tap:46px;
  --dur:220ms;
  --dur-slow:420ms;
  --ease:cubic-bezier(.22,.9,.3,1);
  /* رنگ‌ها — پیش‌فرض Midnight AI (تاریک) */
  --bg:#080c17;
  --bg-2:#0d1424;
  --glow-1:rgba(56,189,248,.16);
  --glow-2:rgba(34,197,94,.12);
  --surface:rgba(20,28,45,.82);
  --surface-solid:#141c2d;
  --surface-2:rgba(32,44,68,.62);
  --surface-3:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --text:#eef4ff;
  --text-2:#a9b7cf;
  --text-3:#75849d;
  --accent:#38bdf8;
  --accent-2:#22c55e;
  --accent-ink:#04121d;
  --accent-rgb:56,189,248;
  --success:#22c55e;
  --warn:#f59e0b;
  --danger:#f43f5e;
  --info:#6366f1;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28);
  --shadow:0 12px 32px -14px rgba(0,0,0,.7);
  --shadow-lg:0 28px 60px -24px rgba(0,0,0,.85);
  --glass-blur:14px;
  --ff:"Vazirmatn","Segoe UI",Tahoma,"Iranian Sans","Noto Naskh Arabic",system-ui,-apple-system,sans-serif;
}
html[data-mode="light"]{
  --bg:#f4f7fc;
  --bg-2:#e8eef8;
  --glow-1:rgba(56,189,248,.18);
  --glow-2:rgba(34,197,94,.12);
  --surface:rgba(255,255,255,.9);
  --surface-solid:#ffffff;
  --surface-2:rgba(238,244,253,.9);
  --surface-3:rgba(15,23,42,.035);
  --border:rgba(15,23,42,.09);
  --border-strong:rgba(15,23,42,.18);
  --text:#0d1728;
  --text-2:#4a5a72;
  --text-3:#7688a1;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 14px 34px -18px rgba(15,23,42,.35);
  --shadow-lg:0 28px 60px -26px rgba(15,23,42,.4);
}
html[data-density="compact"]{--gap:9px;--card-pad:13px;--radius-lg:16px;--radius:12px}
html[data-density="comfy"]{--gap:18px;--card-pad:24px}

html,body{height:100%}
body{
  margin:0;
  font-family:var(--ff);
  font-size:var(--fs-base);
  line-height:1.75;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(880px 520px at 88% -8%,var(--glow-1),transparent 62%),
    radial-gradient(720px 460px at 6% 4%,var(--glow-2),transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
}
img{max-width:100%;display:block}
svg{width:1.1em;height:1.1em;flex:0 0 auto;vertical-align:-.15em}
.brand-logo svg{width:24px;height:24px}
.empty svg{width:38px;height:38px}
.dropzone svg{width:36px;height:36px}
.stat-ico svg{width:18px;height:18px}
.btn svg{width:19px;height:19px}
.icon-btn svg{width:21px;height:21px}
.btn.sm svg{width:16px;height:16px}
.chip svg{width:13px;height:13px}
.list-item .li-ico svg{width:16px;height:16px}
.thumb .del svg{width:14px;height:14px}
.alert svg{width:18px;height:18px}
.acc>summary svg{width:16px;height:16px}
.toast svg{width:18px;height:18px}
.section-title svg,.page-head svg{width:17px;height:17px}
.rec-avatar svg{width:24px;height:24px}
.rec-meta svg{width:12px;height:12px;vertical-align:-1px}
.msg svg{width:16px;height:16px}
.theme-swatch i{min-height:52px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   لایه ۲: چیدمان اصلی
   ============================================================ */
.fx-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.9}
.fx-layer canvas{width:100%;height:100%;display:block}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:60;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 88%,transparent),color-mix(in srgb,var(--bg) 55%,transparent));
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px -10px rgba(var(--accent-rgb),.9);
}
.brand-logo svg{width:24px;height:24px}
.brand-text{min-width:0}
.brand-title{font-size:1.02rem;font-weight:800;letter-spacing:-.2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.68rem;color:var(--text-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.4px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:14px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
  transition:transform var(--dur) var(--ease),background var(--dur),color var(--dur),border-color var(--dur);
}
.icon-btn:active{transform:scale(.93)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn svg{width:21px;height:21px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--text-3);flex:0 0 auto}
.status-dot.on{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
.status-dot.off{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}

main.view{
  flex:1;width:100%;max-width:1080px;margin:0 auto;
  padding:16px 14px calc(112px + env(safe-area-inset-bottom));
}
.view-enter{animation:viewIn var(--dur-slow) var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid var(--border);
  max-width:1080px;margin:0 auto;
}
.tab-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 2px;border-radius:14px;color:var(--text-3);font-size:.66rem;font-weight:600;
  transition:color var(--dur),background var(--dur),transform var(--dur) var(--ease);
  min-height:var(--tap);
}
.tab-btn svg{width:22px;height:22px;transition:transform var(--dur) var(--ease)}
.tab-btn:active{transform:scale(.94)}
.tab-btn.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tab-btn.active svg{transform:translateY(-1px)}

/* ============================================================
   لایه ۳: کارت‌ها، سرصفحه‌ها، دکمه‌ها
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:var(--card-pad);
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--glass-blur)) saturate(130%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(130%);
  position:relative;
  overflow:hidden;
}
.card.flat{background:var(--surface-2);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.card.tight{padding:calc(var(--card-pad) * .72)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-title{font-size:.98rem;font-weight:700;margin:0;flex:1;min-width:0}
.card-title small{display:block;font-size:.72rem;font-weight:500;color:var(--text-3);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:var(--gap)}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grow{flex:1;min-width:0}
.page-head{margin:2px 0 14px}
.page-title{font-size:1.28rem;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.page-sub{margin:0;color:var(--text-3);font-size:.8rem}
.section-title{font-size:.86rem;font-weight:700;color:var(--text-2);margin:6px 2px 10px;display:flex;align-items:center;gap:8px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:11px 18px;border-radius:14px;
  font-size:.86rem;font-weight:700;letter-spacing:0;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur),background var(--dur),border-color var(--dur),opacity var(--dur);
  -webkit-tap-highlight-color:transparent;text-align:center;
}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent-2) 55%,var(--accent)));
  color:var(--accent-ink);border-color:transparent;
  box-shadow:0 12px 26px -14px rgba(var(--accent-rgb),.95);
}
.btn.ghost{background:transparent}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 34%,transparent)}
.btn.danger-solid{background:var(--danger);color:#fff;border-color:transparent}
.btn.success{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);border-color:color-mix(in srgb,var(--success) 32%,transparent)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.78rem;border-radius:12px}
.btn.sm svg{width:16px;height:16px}
.btn.block{width:100%}
.btn.wide{flex:1}
.btn.icon-only{padding:0;width:var(--tap);min-width:var(--tap)}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.btn-row.stretch>*{flex:1 1 0;min-width:0}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;font-size:.72rem;font-weight:600;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-2);
  white-space:nowrap;
}
.chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.chip.success{color:var(--success);background:color-mix(in srgb,var(--success) 13%,transparent);border-color:color-mix(in srgb,var(--success) 28%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
.chip.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent);border-color:color-mix(in srgb,var(--info) 28%,transparent)}
.chip svg{width:13px;height:13px}
.chips{display:flex;gap:7px;flex-wrap:wrap}

.hero{
  position:relative;overflow:hidden;
  border-radius:var(--radius-xl);
  padding:calc(var(--card-pad) + 4px);
  background:
    radial-gradient(520px 260px at 92% -20%,rgba(var(--accent-rgb),.34),transparent 65%),
    radial-gradient(380px 220px at 4% 110%,color-mix(in srgb,var(--accent-2) 26%,transparent),transparent 62%),
    linear-gradient(150deg,color-mix(in srgb,var(--surface-solid) 94%,transparent),color-mix(in srgb,var(--surface-solid) 74%,transparent));
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.07) 50%,transparent 62%);
  transform:translateX(-30%);animation:sheen 9s ease-in-out infinite;
}
@keyframes sheen{0%,72%{transform:translateX(-40%)}100%{transform:translateX(120%)}}
.hero h1{margin:0 0 6px;font-size:1.22rem;font-weight:800;letter-spacing:-.4px}
.hero p{margin:0;color:var(--text-2);font-size:.8rem;max-width:52ch}
.hero .chips{margin-top:14px}

/* آمار */
.stat{
  padding:calc(var(--card-pad) * .82);border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform var(--dur) var(--ease),border-color var(--dur);
}
.stat:hover{border-color:var(--border-strong)}
.stat-ico{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:9px;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);
}
.stat-ico svg{width:18px;height:18px}
.stat-ico.g{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.stat-ico.w{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.stat-ico.r{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.stat-ico.i{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.stat-value{font-size:1.42rem;font-weight:800;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat-label{font-size:.72rem;color:var(--text-3);margin-top:2px}
.stat-hint{font-size:.66rem;color:var(--text-3);margin-top:5px;opacity:.85}

/* نوار پیشرفت */
.progress{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width var(--dur-slow) var(--ease);width:0}
.progress.indeterminate>i{width:38%!important;animation:indet 1.15s linear infinite}
@keyframes indet{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}

/* فهرست‌ها */
.list{display:flex;flex-direction:column;gap:9px}
.list-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:var(--radius);
  background:var(--surface-3);border:1px solid var(--border);
}
.list-item .li-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);flex:0 0 auto}
.list-item .li-ico svg{width:16px;height:16px}
.list-item .li-main{min-width:0;flex:1}
.list-item .li-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-sub{font-size:.68rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{
  text-align:center;padding:34px 18px;color:var(--text-3);
  border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--surface-3);
}
.empty svg{width:38px;height:38px;margin:0 auto 10px;opacity:.55;display:block}
.empty b{display:block;color:var(--text-2);font-size:.88rem;margin-bottom:3px}
.empty span{font-size:.76rem}

/* ============================================================
   لایه ۴: فرم‌ها
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:.76rem;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.label .req{color:var(--danger)}
.hint{font-size:.68rem;color:var(--text-3);line-height:1.6}
.input,.select,.textarea{
  width:100%;min-height:var(--tap);padding:11px 14px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:border-color var(--dur),background var(--dur),box-shadow var(--dur);
  font-size:.86rem;
}
textarea.input,.textarea{min-height:88px;resize:vertical;line-height:1.8}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);
}
.input:disabled{opacity:.6}
.select{appearance:none;-webkit-appearance:none;padding-left:34px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2388a0bd' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:left 12px center;
}
.switch{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;gap:14px}
.switch-label{font-size:.82rem;font-weight:600}
.switch-label small{display:block;font-size:.68rem;font-weight:400;color:var(--text-3);margin-top:2px;line-height:1.5}
.toggle{
  position:relative;width:52px;height:30px;border-radius:999px;flex:0 0 auto;
  background:var(--surface-3);border:1px solid var(--border-strong);
  transition:background var(--dur),border-color var(--dur);
}
.toggle::after{
  content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:var(--text-3);transition:transform var(--dur) var(--ease),background var(--dur);
}
.toggle[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 34%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.toggle[aria-checked="true"]::after{transform:translateX(-22px);background:var(--accent)}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;
}
input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border)}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-10px;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));border:2px solid var(--surface-solid);
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
input[type="range"]::-moz-range-track{height:6px;border-radius:999px;background:var(--surface-3)}
input[type="range"]::-moz-range-thumb{width:22px;height:22px;border:2px solid var(--surface-solid);border-radius:50%;background:var(--accent)}
.segmented{display:flex;gap:5px;padding:4px;background:var(--surface-3);border:1px solid var(--border);border-radius:14px}
.segmented button{
  flex:1;min-height:38px;padding:7px 8px;border-radius:11px;font-size:.76rem;font-weight:600;color:var(--text-3);
  transition:background var(--dur),color var(--dur);
}
.segmented button[aria-pressed="true"]{background:var(--surface-solid);color:var(--accent);box-shadow:var(--shadow-sm)}

/* انتخاب تصویر */
.dropzone{
  display:block;border:1.6px dashed var(--border-strong);border-radius:var(--radius-lg);
  padding:26px 16px;text-align:center;background:var(--surface-3);
  transition:border-color var(--dur),background var(--dur),transform var(--dur) var(--ease);
}
.dropzone:active{transform:scale(.99)}
.dropzone.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dropzone svg{width:36px;height:36px;margin:0 auto 8px;opacity:.7;display:block;color:var(--accent)}
.dropzone b{display:block;font-size:.86rem;margin-bottom:3px}
.dropzone span{font-size:.72rem;color:var(--text-3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.thumb{
  position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--border);
  background:var(--surface-2);aspect-ratio:1;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .badge{
  position:absolute;inset-inline-start:0;inset-block-end:0;font-size:.58rem;padding:2px 7px;
  background:rgba(0,0,0,.66);color:#fff;border-start-end-radius:9px;backdrop-filter:blur(4px);
}
.thumb .del{
  position:absolute;top:5px;inset-inline-end:5px;width:26px;height:26px;border-radius:9px;
  display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(4px);
}
.thumb .del svg{width:14px;height:14px}
.thumb.skeleton{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}

/* تصویر پیش‌نمایش بزرگ */
.preview-box{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#000;border:1px solid var(--border)}
.preview-box img,.preview-box canvas,.preview-box video{width:100%;height:auto;display:block;max-height:62vh;object-fit:contain}
.preview-box .overlay{position:absolute;inset:0}
.face-box{
  position:absolute;border:2px solid var(--success);border-radius:8px;
  box-shadow:0 0 0 1px rgba(0,0,0,.35);
}
.face-box.unknown{border-color:var(--warn)}
.face-box .tag{
  position:absolute;inset-block-end:100%;inset-inline-start:-2px;margin-bottom:4px;
  font-size:.62rem;padding:2px 7px;border-radius:6px;background:var(--success);color:#04180c;
  white-space:nowrap;font-weight:700;
}
.face-box.unknown .tag{background:var(--warn);color:#1c1200}

/* جدول/فهرست پرونده */
.rec-card{
  display:flex;gap:12px;align-items:center;padding:11px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
  transition:transform var(--dur) var(--ease),border-color var(--dur);
}
.rec-card:active{transform:scale(.99);border-color:var(--border-strong)}
.rec-avatar{
  width:56px;height:56px;border-radius:15px;overflow:hidden;flex:0 0 auto;
  background:var(--surface-2);display:grid;place-items:center;color:var(--text-3);
  border:1px solid var(--border);
}
.rec-avatar img{width:100%;height:100%;object-fit:cover}
.rec-avatar svg{width:24px;height:24px}
.rec-body{flex:1;min-width:0}
.rec-name{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta{font-size:.68rem;color:var(--text-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.rec-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}

/* مدال */
.modal-root{position:fixed;inset:0;z-index:200;display:none}
.modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,7,15,.62);backdrop-filter:blur(6px);animation:fadeIn var(--dur) ease both}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;
  background:var(--surface-solid);border:1px solid var(--border);
  border-radius:24px 24px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lg);animation:sheetUp var(--dur-slow) var(--ease) both;
}
@media(min-width:720px){
  .sheet{left:50%;right:auto;bottom:auto;top:8vh;transform:translateX(-50%);width:min(620px,92vw);border-radius:22px;max-height:84vh;animation:modalIn var(--dur) var(--ease) both}
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes modalIn{from{transform:translateX(-50%) scale(.96);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-handle{width:44px;height:4px;border-radius:99px;background:var(--border-strong);margin:8px auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheet-title{font-size:1.02rem;font-weight:800;margin:0;flex:1}
.sheet-sub{font-size:.74rem;color:var(--text-3);margin:3px 0 0}
.sheet-body{display:flex;flex-direction:column;gap:var(--gap)}
.sheet-foot{display:flex;gap:9px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.sheet-foot .btn{flex:1}

/* توست */
.toast-root{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  display:flex;align-items:center;gap:9px;max-width:520px;width:100%;
  padding:12px 15px;border-radius:15px;font-size:.8rem;font-weight:600;
  background:var(--surface-solid);border:1px solid var(--border-strong);color:var(--text);
  box-shadow:var(--shadow-lg);animation:toastIn var(--dur-slow) var(--ease) both;
}
.toast.out{animation:toastOut var(--dur) ease both}
.toast svg{width:18px;height:18px;flex:0 0 auto}
.toast.success svg{color:var(--success)}
.toast.error svg{color:var(--danger)}
.toast.warn svg{color:var(--warn)}
.toast.info svg{color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.98)}}

/* دستیار */
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--surface-2);border:1px solid var(--border);border-end-start-radius:6px;align-self:flex-start}
.msg.user{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent-2) 55%,var(--accent)));color:var(--accent-ink);font-weight:600;border-end-end-radius:6px;align-self:flex-end}
.msg b{font-weight:800}
.quick-replies{display:flex;gap:7px;flex-wrap:wrap}

/* راهنما / آکاردئون */
.acc{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-3);overflow:hidden}
.acc+.acc{margin-top:9px}
.acc>summary{
  list-style:none;cursor:pointer;padding:13px 14px;font-size:.82rem;font-weight:700;
  display:flex;align-items:center;gap:9px;
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";width:9px;height:9px;border-inline-end:2px solid var(--text-3);border-block-end:2px solid var(--text-3);transform:rotate(45deg);margin-inline-start:auto;transition:transform var(--dur) var(--ease);flex:0 0 auto}
.acc[open]>summary::after{transform:rotate(-135deg)}
.acc-body{padding:0 14px 14px;font-size:.78rem;color:var(--text-2);line-height:1.9}
.acc-body ol,.acc-body ul{margin:6px 0;padding-inline-start:18px}
.acc-body li{margin-bottom:4px}
.acc-body code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.74rem;direction:ltr;display:inline-block}

/* تم‌ها */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.theme-card{
  border-radius:15px;border:2px solid var(--border);padding:0;overflow:hidden;background:var(--surface-2);
  transition:border-color var(--dur),transform var(--dur) var(--ease);text-align:start;
}
.theme-card[aria-pressed="true"]{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(var(--accent-rgb),1)}
.theme-swatch{height:52px;display:flex}
.theme-swatch i{flex:1;display:block}
.theme-name{padding:7px 10px;font-size:.7rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accent-swatches{display:flex;gap:9px;flex-wrap:wrap}
.accent-swatch{width:34px;height:34px;border-radius:11px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.accent-swatch[aria-pressed="true"]{border-color:var(--text);transform:scale(1.08)}

/* متفرقه */
.divider{height:1px;background:var(--border);margin:6px 0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;padding:7px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-3)}
.kv b{font-weight:700;text-align:end;word-break:break-word}
.mono{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.badge-num{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:1px 7px;font-size:.68rem;color:var(--text-3)}
.alert{display:flex;gap:10px;padding:12px 13px;border-radius:14px;font-size:.76rem;line-height:1.8;border:1px solid}
.alert svg{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
.alert.info{background:color-mix(in srgb,var(--info) 10%,transparent);border-color:color-mix(in srgb,var(--info) 28%,transparent);color:var(--text-2)}
.alert.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text-2)}
.alert.danger{background:color-mix(in srgb,var(--danger) 10%,transparent);border-color:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--text-2)}
.alert.success{background:color-mix(in srgb,var(--success) 10%,transparent);border-color:color-mix(in srgb,var(--success) 30%,transparent);color:var(--text-2)}
.alert b{color:var(--text)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.4px solid color-mix(in srgb,var(--text-3) 40%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton-line{height:11px;border-radius:6px;background:var(--surface-3);animation:pulse 1.4s ease-in-out infinite}

/* واکنش‌گرایی */
@media(max-width:520px){
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-title{font-size:1.16rem}
  .brand-sub{display:none}
}
@media(min-width:900px){
  main.view{padding-inline:22px;padding-top:22px}
  .topbar{padding-inline:22px}
}
@media(prefers-reduced-motion:reduce){
  html[data-anim="on"] *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
html[data-anim="off"] *{animation:none!important;transition:none!important}
html[data-fx="none"] .fx-layer{display:none}
html[data-cards="off"] .stat,html[data-cards="off"] .rec-card{transition:none}
</style>

<script>
/* ============================================================
   CHEHREHBAN AI — هسته برنامه
   ماژول ۱: ابزارها، تنظیمات، تم‌ها، رابط پایه (توست/مدال)، افکت‌ها
   ============================================================ */
(function () {
  'use strict';

  const APP = { name: 'CHEHREHBAN AI', fa: 'چهره‌بان هوشمند', version: '1.0.0', build: '2026-10-28' };

  /* ---------- ابزارهای عمومی ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value).replace(/[&<>"']/g, (c) => ESC_MAP[c]);
  }
  function icon(id, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
  function uid(prefix) {
    const t = Date.now().toString(36);
    const r = Math.random().toString(36).slice(2, 8);
    return (prefix || 'id') + '_' + t + r;
  }
  const FA_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
  function faNum(input) {
    return String(input).replace(/[0-9]/g, (d) => FA_DIGITS[+d]);
  }
  function fmtInt(n) { return faNum((Number(n) || 0).toLocaleString('en-US')); }
  function fmtBytes(bytes) {
    const b = Number(bytes) || 0;
    if (b < 1024) return faNum(b) + ' بایت';
    if (b < 1048576) return faNum((b / 1024).toFixed(1)) + ' کیلوبایت';
    if (b < 1073741824) return faNum((b / 1048576).toFixed(1)) + ' مگابایت';
    return faNum((b / 1073741824).toFixed(2)) + ' گیگابایت';
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    try {
      return new Date(ts).toLocaleString('fa-IR', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return new Date(ts).toISOString().slice(0, 16).replace('T', ' '); }
  }
  function fmtMs(ms) { return faNum((Math.round(Number(ms) || 0)).toLocaleString('en-US')) + ' میلی‌ثانیه'; }
  function fmtDistance(d) { return Number(d).toFixed(4); }
  function debounce(fn, wait) {
    let t = null;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(ctx, args), wait);
    };
  }
  function sleep(ms) { return new Promise((res) => setTimeout(res, ms)); }
  function safeJsonParse(text) { try { return { ok: true, value: JSON.parse(text) }; } catch (e) { return { ok: false, error: e }; } }
  function normalizeText(s) {
    return String(s || '')
      .replace(/[ي]/g, 'ی').replace(/[ك]/g, 'ک')
      .replace(/[\u064B-\u0652\u0670]/g, '')
      .replace(/\u200c/g, ' ')
      .toLowerCase().trim();
  }
  function clampText(s, max) { s = String(s || '').trim(); return s.length > max ? s.slice(0, max) : s; }

  /* ---------- تنظیمات ---------- */
  const THEMES = [
    { id: 'midnight', name: 'Midnight AI', accent: '#38bdf8', accent2: '#22c55e', hue: 222, sat: 26, mode: 'dark' },
    { id: 'emerald', name: 'Emerald Intelligence', accent: '#10b981', accent2: '#34d399', hue: 162, sat: 22, mode: 'dark' },
    { id: 'royal', name: 'Royal Purple', accent: '#a855f7', accent2: '#6366f1', hue: 268, sat: 26, mode: 'dark' },
    { id: 'obsidian', name: 'Obsidian Dark', accent: '#38bdf8', accent2: '#94a3b8', hue: 220, sat: 7, mode: 'dark' },
    { id: 'arctic', name: 'Arctic Light', accent: '#0284c7', accent2: '#0d9488', hue: 204, sat: 42, mode: 'light' },
    { id: 'sand', name: 'Warm Sand', accent: '#b45309', accent2: '#0f766e', hue: 35, sat: 30, mode: 'light' },
    { id: 'cyber', name: 'Cyber Neon', accent: '#22d3ee', accent2: '#f43f5e', hue: 288, sat: 30, mode: 'dark' },
    { id: 'minimal', name: 'Minimal Professional', accent: '#1d4ed8', accent2: '#475569', hue: 215, sat: 8, mode: 'light' },
    { id: 'ocean', name: 'Ocean Blue', accent: '#2563eb', accent2: '#06b6d4', hue: 214, sat: 34, mode: 'dark' },
    { id: 'rose', name: 'Rose Gold', accent: '#be123c', accent2: '#b45309', hue: 345, sat: 26, mode: 'light' }
  ];

  const FX_LIST = [
    { id: 'none', name: 'بدون افکت' },
    { id: 'particles', name: 'ذرات شناور' },
    { id: 'grid', name: 'شبکه دیجیتال' },
    { id: 'glow', name: 'درخشش ملایم' },
    { id: 'lines', name: 'خطوط متحرک' },
    { id: 'rain', name: 'بارش نمادهای دیجیتال' }
  ];

  const SETTINGS_DEFAULTS = {
    theme: 'midnight',
    mode: 'dark',
    accentCustom: '',
    fontSize: 15,
    density: 'normal',
    anim: true,
    fx: 'particles',
    fxIntensity: 'low',
    threshold: 0.6,
    autoActivate: false,
    cameraFacing: 'user',
    mirror: true,
    showBoxes: true
  };

  const SETTINGS_KEY = 'chehrehban.settings.v1';
  const Settings = {
    data: Object.assign({}, SETTINGS_DEFAULTS),
    load() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
          const p = safeJsonParse(raw);
          if (p.ok && p.value && typeof p.value === 'object') {
            const merged = Object.assign({}, SETTINGS_DEFAULTS);
            Object.keys(SETTINGS_DEFAULTS).forEach((k) => {
              if (p.value[k] !== undefined && typeof p.value[k] === typeof SETTINGS_DEFAULTS[k]) merged[k] = p.value[k];
            });
            if (THEMES.some((t) => t.id === merged.theme) === false) merged.theme = SETTINGS_DEFAULTS.theme;
            this.data = merged;
          }
        }
      } catch (e) { /* localStorage ممکن است غیرفعال باشد */ }
      return this.data;
    },
    save() {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.data)); return true; }
      catch (e) { return false; }
    },
    set(key, value) {
      this.data[key] = value;
      this.save();
      applySettings();
      return this.data[key];
    },
    reset() {
      this.data = Object.assign({}, SETTINGS_DEFAULTS);
      this.save();
      applySettings();
    },
    theme() { return THEMES.find((t) => t.id === this.data.theme) || THEMES[0]; }
  };

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || ''));
    if (!m) return [56, 189, 248];
    return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
  }
  function relativeLuminance(hex) {
    const rgb = hexToRgb(hex).map((v) => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }

  function buildThemeCss() {
    const out = [];
    THEMES.forEach((t) => {
      const h = t.hue, s = t.sat;
      const accent = t.accent, accent2 = t.accent2;
      const rgb = hexToRgb(accent).join(',');
      const ink = relativeLuminance(accent) > 0.45 ? '#04121d' : '#ffffff';
      const darkVars = [
        '--bg:hsl(' + h + ' ' + Math.round(s * 0.9) + '% 5%)',
        '--bg-2:hsl(' + h + ' ' + Math.round(s) + '% 9%)',
        '--surface-solid:hsl(' + h + ' ' + Math.round(s * 0.85) + '% 12%)',
        '--surface:hsla(' + h + ', ' + Math.round(s * 0.85) + '%, 13%, .84)',
        '--surface-2:hsla(' + h + ', ' + Math.round(s) + '%, 20%, .72)',
        '--surface-3:hsla(' + h + ', 40%, 92%, .05)',
        '--border:hsla(' + h + ', 40%, 92%, .10)',
        '--border-strong:hsla(' + h + ', 40%, 92%, .18)',
        '--text:#eef4ff',
        '--text-2:hsl(' + h + ' 16% 73%)',
        '--text-3:hsl(' + h + ' 12% 57%)',
        '--accent:' + accent, '--accent-2:' + accent2, '--accent-ink:' + ink, '--accent-rgb:' + rgb,
        '--glow-1:rgba(' + rgb + ',.17)', '--glow-2:rgba(' + hexToRgb(accent2).join(',') + ',.12)'
      ];
      const lightVars = [
        '--bg:hsl(' + h + ' ' + Math.round(s * 1.2) + '% 97%)',
        '--bg-2:hsl(' + h + ' ' + Math.round(s * 1.1) + '% 93.5%)',
        '--surface-solid:#ffffff',
        '--surface:hsla(' + h + ', ' + Math.round(s * 1.5) + '%, 100%, .92)',
        '--surface-2:hsla(' + h + ', ' + Math.round(s * 1.4) + '%, 96%, .96)',
        '--surface-3:hsla(' + h + ', 30%, 12%, .045)',
        '--border:hsla(' + h + ', 30%, 12%, .11)',
        '--border-strong:hsla(' + h + ', 30%, 12%, .2)',
        '--text:hsl(' + h + ' 32% 9%)',
        '--text-2:hsl(' + h + ' 18% 31%)',
        '--text-3:hsl(' + h + ' 14% 45%)',
        '--accent:' + accent, '--accent-2:' + accent2, '--accent-ink:' + ink, '--accent-rgb:' + rgb,
        '--glow-1:rgba(' + rgb + ',.16)', '--glow-2:rgba(' + hexToRgb(accent2).join(',') + ',.1)'
      ];
      out.push('html[data-theme="' + t.id + '"]{' + darkVars.join(';') + '}');
      out.push('html[data-theme="' + t.id + '"][data-mode="light"]{' + lightVars.join(';') + '}');
    });
    return out.join('\n');
  }

  let themeStyleTag = null;
  function injectThemeCss() {
    if (!themeStyleTag) {
      themeStyleTag = document.createElement('style');
      themeStyleTag.id = 'themeStyles';
      document.head.appendChild(themeStyleTag);
    }
    themeStyleTag.textContent = buildThemeCss();
  }

  function applySettings() {
    const s = Settings.data;
    const html = document.documentElement;
    html.setAttribute('data-theme', s.theme);
    html.setAttribute('data-mode', s.mode);
    html.setAttribute('data-density', s.density);
    html.setAttribute('data-anim', s.anim ? 'on' : 'off');
    html.setAttribute('data-fx', s.fx === 'none' ? 'none' : 'on');
    if (s.accentCustom) {
      const rgb = hexToRgb(s.accentCustom).join(',');
      html.style.setProperty('--accent', s.accentCustom);
      html.style.setProperty('--accent-rgb', rgb);
      html.style.setProperty('--accent-ink', relativeLuminance(s.accentCustom) > 0.45 ? '#04121d' : '#ffffff');
    } else {
      html.style.removeProperty('--accent');
      html.style.removeProperty('--accent-rgb');
      html.style.removeProperty('--accent-ink');
    }
    document.documentElement.style.setProperty('--fs-base', s.fontSize + 'px');
    const meta = document.getElementById('metaThemeColor');
    if (meta) {
      const bg = getComputedStyle(html).getPropertyValue('--bg').trim();
      if (bg) meta.setAttribute('content', bg);
    }
    const modeUse = document.getElementById('modeIconUse');
    if (modeUse) modeUse.setAttribute('href', s.mode === 'dark' ? '#i-sun' : '#i-moon');
    if (window.CB && window.CB.FX) window.CB.FX.sync();
  }

  /* ---------- توست ---------- */
  const TOAST_ICON = { success: 'i-check', error: 'i-x', warn: 'i-warn', info: 'i-info' };
  function toast(message, type, ms) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    el.innerHTML = icon(TOAST_ICON[type] || 'i-info') + '<div>' + esc(message) + '</div>';
    root.appendChild(el);
    const life = ms || (type === 'error' ? 5200 : 3200);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 260);
    }, life);
  }

  /* ---------- مدال / شیت ---------- */
  const Modal = {
    el: null,
    onClose: null,
    init() {
      this.el = document.getElementById('modalRoot');
      if (!this.el) return;
      this.el.addEventListener('click', (ev) => {
        if (ev.target.closest('[data-close-modal]')) this.close();
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && this.isOpen()) this.close();
      });
    },
    isOpen() { return this.el && this.el.classList.contains('open'); },
    open(opts) {
      if (!this.el) return;
      const o = opts || {};
      document.getElementById('sheetTitle').textContent = o.title || '';
      const sub = document.getElementById('sheetSub');
      sub.textContent = o.sub || '';
      sub.style.display = o.sub ? '' : 'none';
      document.getElementById('sheetBody').innerHTML = o.body || '';
      const foot = document.getElementById('sheetFoot');
      foot.innerHTML = '';
      (o.actions || []).forEach((a) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (a.variant || 'ghost');
        b.innerHTML = (a.icon ? icon(a.icon) : '') + '<span>' + esc(a.label) + '</span>';
        b.addEventListener('click', () => {
          if (a.onClick) a.onClick(b);
          else this.close();
        });
        foot.appendChild(b);
      });
      foot.style.display = (o.actions && o.actions.length) ? 'flex' : 'none';
      this.el.classList.add('open');
      this.el.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      this.onClose = o.onClose || null;
      if (o.onMount) o.onMount(document.getElementById('sheetBody'));
    },
    close() {
      if (!this.el) return;
      this.el.classList.remove('open');
      this.el.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      const cb = this.onClose;
      this.onClose = null;
      if (cb) cb();
    },
    confirm(opts) {
      return new Promise((resolve) => {
        let settled = false;
        this.open({
          title: opts.title || 'تأیید عملیات',
          sub: opts.sub || '',
          body: '<div class="alert ' + (opts.variant === 'danger' ? 'danger' : 'info') + '">' +
            icon(opts.variant === 'danger' ? 'i-warn' : 'i-info') +
            '<div>' + esc(opts.message || '') + '</div></div>',
          actions: [
            { label: opts.cancelLabel || 'انصراف', variant: 'ghost', onClick: () => { settled = true; Modal.close(); resolve(false); } },
            { label: opts.confirmLabel || 'تأیید', variant: opts.variant === 'danger' ? 'danger-solid' : 'primary', onClick: () => { settled = true; Modal.close(); resolve(true); } }
          ],
          onClose: () => { if (!settled) resolve(false); }
        });
      });
    }
  };

  /* ---------- افکت‌های پس‌زمینه ---------- */
  const FX = {
    canvas: null, ctx: null, raf: null, mode: 'none', particles: [], t: 0, dpr: 1,
    init() {
      this.canvas = document.getElementById('fxCanvas');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d', { alpha: true });
      this.sync();
      window.addEventListener('resize', debounce(() => this.resize(), 220));
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) this.stop(); else this.sync();
      });
    },
    reduceMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    },
    sync() {
      const s = Settings.data;
      const want = (s.fx === 'none' || !s.anim || this.reduceMotion()) ? 'none' : s.fx;
      if (want === this.mode) { if (want !== 'none') this.resize(); return; }
      this.mode = want;
      if (want === 'none') { this.stop(); return; }
      this.resize();
      this.start();
    },
    resize() {
      if (!this.canvas) return;
      this.dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth, h = window.innerHeight;
      this.canvas.width = Math.floor(w * this.dpr);
      this.canvas.height = Math.floor(h * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.w = w; this.h = h;
      const density = Settings.data.fxIntensity === 'high' ? 1 : (Settings.data.fxIntensity === 'medium' ? 0.6 : 0.32);
      const count = clamp(Math.round((w * h) / 26000 * density), 8, 90);
      this.particles = [];
      for (let i = 0; i < count; i++) {
        this.particles.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
          r: 0.7 + Math.random() * 1.8, a: 0.16 + Math.random() * 0.4,
          ch: ['0', '1', '·', '+', '×'][Math.floor(Math.random() * 5)]
        });
      }
    },
    start() {
      this.stop();
      if (!this.ctx) return;
      const loop = () => {
        this.raf = requestAnimationFrame(loop);
        this.draw();
      };
      this.raf = requestAnimationFrame(loop);
    },
    stop() {
      if (this.raf) cancelAnimationFrame(this.raf);
      this.raf = null;
      if (this.ctx && this.w) this.ctx.clearRect(0, 0, this.w, this.h);
    },
    color() {
      const c = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      return c || '#38bdf8';
    },
    draw() {
      const ctx = this.ctx, w = this.w, h = this.h;
      if (!ctx || !w) return;
      ctx.clearRect(0, 0, w, h);
      const color = this.color();
      this.t += 1;
      const mode = this.mode;
      if (mode === 'particles' || mode === 'grid') {
        this.particles.forEach((p) => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
          if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
          ctx.globalAlpha = p.a * 0.85;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        if (mode === 'grid') {
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.09;

    async analyze(input, options) {

    inputSize(input) {
      if (!input) return { w: 0, h: 0 };
      if (input.videoWidth) return { w: input.videoWidth, h: input.videoHeight };
      if (input.naturalWidth) return { w: input.naturalWidth, h: input.naturalHeight };
      return { w: input.width || 0, h: input.height || 0 };
    },

    distance(a, b) {
      let d = 0;
      for (let i = 0; i < 128; i++) { const diff = a[i] - b[i]; d += diff * diff; }
      return Math.sqrt(d);
    },

    /* اجرای زنجیره‌ای پردازش‌ها؛ از اجرای همزمان سنگین جلوگیری می‌کند */
    enqueue(task) {
      const run = this.queue.then(() => task());
      this.queue = run.catch(() => {});
      return run;
    },

    release() {
      /* آزادسازی منابع مدل‌ها؛ مدل‌ها بعد از فعال‌سازی سبک هستند، اما در صورت نیاز آزاد می‌شوند */
      const fa = this.faceapi();
      if (!fa) return;
      try {
        if (fa.tf && fa.tf.disposeVariables) fa.tf.disposeVariables();
      } catch (e) {}
      this.status = 'idle';
      this.models = {};
      this.backend = null;
      this.emit('آزادسازی منابع موتور', 0);
    },

    thresholdLabel(th) {
      const t = Number(th);
      if (t <= 0.5) return 'سخت‌گیرانه';
      if (t <= 0.65) return 'متعادل';
      return 'آسان‌گیرانه';
    },

    similarityPercent(distance) {
      /* شاخص شباهت صرفاً برای نمایش است؛ احتمال قطعی هویت نیست */
      return Math.round(CB.clamp((1 - distance) * 100, 0, 100));
    }
  };

  CB.ENGINE_ERRORS = ERRORS;
  CB.ENGINE_MODELS = MODEL_SPECS;

  function filteredRecords() {
    const f = Ui.filters;
    let list = Records.list.slice();
    if (f.status !== 'all') list = list.filter((r) => r.status === f.status);
    if (f.onlyFaces) list = list.filter((r) => Records.faceCount(r.id) > 0);
    if (f.query) {
      const q = CB.normalizeText(f.query);
      list = list.filter((r) => {
        const hay = CB.normalizeText([r.firstName, r.lastName, r.alias, r.notes, (r.tags || []).join(' ')].join(' '));
        return hay.includes(q);
      });
    }
    const sorters = {
      new: (a, b) => b.createdAt - a.createdAt,
      old: (a, b) => a.createdAt - b.createdAt,
      name: (a, b) => Records.name(a).localeCompare(Records.name(b), 'fa'),
      images: (a, b) => (b.imageIds || []).length - (a.imageIds || []).length,
      faces: (a, b) => Records.faceCount(b.id) - Records.faceCount(a.id)
    };
    list.sort(sorters[f.sort] || sorters.new);
    return list;
  }

  async function renderExistingThumbs(ids) {

      const img = await Images.get(id);

      const badge = state === 'ok' ? 'ویژگی استخراج شد' : state === 'error' ? 'خطا' : state === 'noface' ? 'بدون چهره' : 'پردازش‌نشده';

      return '<div class="thumb">' +
        '<img src="' + img.dataUrl + '" alt="" loading="lazy">' +

        '<button class="del" type="button" data-remove-existing="' + esc(id) + '" aria-label="حذف تصویر">' + icon('i-x') + '</button>' +
        '</div>';

  async function addFilesToForm(files) {
    if (!files || !files.length) return;
    const box = document.getElementById('formProgress');
    const f = Ui.form;
    for (let idx = 0; idx < files.length; idx++) {
      const file = files[idx];
      if (box) box.innerHTML = '<div class="row" style="gap:9px"><span class="spinner"></span><span class="grow" style="font-size:.76rem">پردازش تصویر ' + faNum(idx + 1) + ' از ' + faNum(files.length) + ': ' + esc(file.name || '') + '</span></div>' + progressBar(((idx) / files.length) * 100);
      const item = { dataUrl: '', width: 0, height: 0, bytes: 0, fileName: file.name || '', faces: [], processing: 'pending', error: null };
      const proc = await Images.processFile(file);
      if (!proc.ok) {
        item.processing = 'error';
        item.error = proc.message;
        f.images.push(item);
        renderFormThumbs();
        toast('تصویر رد شد: ' + proc.message, 'error', 5200);
        continue;
      }
      item.dataUrl = proc.dataUrl; item.width = proc.width; item.height = proc.height; item.bytes = proc.bytes;
      f.images.push(item);
      renderFormThumbs();
      if (!Engine.isReady()) {
        item.processing = 'skipped';
        item.error = 'موتور فعال نیست؛ ویژگی چهره استخراج نشد.';
        continue;
      }
      try {
        const imgEl = await Images.loadImage(proc.dataUrl);
        const res = await Engine.enqueue(() => Engine.analyze(imgEl, { inputSize: 416 }));
        if (!res.ok) {
          item.processing = 'error'; item.error = res.title + ' — ' + res.message;
          toast(res.title, 'error', 4800);
          await Stats.bump('imagesFailed');
        } else if (!res.faces.length) {
          item.processing = 'noface'; item.error = 'هیچ چهره‌ای در این تصویر پیدا نشد.';
          toast('در تصویر «' + (file.name || '') + '» چهره‌ای پیدا نشد.', 'warn', 4600);
        } else {
          item.processing = 'ok';
          item.faces = res.faces;
          item.ms = res.ms;
          await Stats.bump('imagesProcessed');
        }
      } catch (e) {
        item.processing = 'error'; item.error = e.message || 'خطای پردازش';
      }
      renderFormThumbs();
    }
    if (box) {
      box.innerHTML = '';
      if (!Engine.isReady()) {
        box.innerHTML = '<div class="alert warn">' + CB.icon('i-warn') + '<div>تصاویر آماده ذخیره هستند، اما ویژگی چهره استخراج نشده است. برای قابل‌شناسایی‌شدن پرونده، موتور را فعال کرده و پرونده را ویرایش/بازپردازش کنید.</div></div>';
      }
    }
  }

  async function saveRecordForm() {
    const f = Ui.form;
    if (f.busy) return;
    const firstName = $('#fFirst').value.trim();
    const lastName = $('#fLast').value.trim();
    const alias = $('#fAlias').value.trim();
    const notes = $('#fNotes').value.trim();
    const status = $('#fStatus').value;
    const tags = $('#fTags').value.split(/[,،]/).map((t) => t.trim()).filter(Boolean);
    if (!firstName && !lastName) { toast('حداقل نام یا نام خانوادگی را وارد کنید.', 'warn'); $('#fFirst').focus(); return; }
    if (!DB.available) { toast('ذخیره‌سازی پایدار در دسترس نیست: ' + (DB.error || 'IndexedDB غیرفعال است'), 'error', 7000); return; }
    const dup = Records.isDuplicate({ firstName, lastName }, f.recordId);
    if (dup) {
      const go = await Modal.confirm({
        title: 'پرونده تکراری',
        message: 'پرونده‌ای با همین نام و نام خانوادگی وجود دارد: «' + Records.name(dup) + '». آیا باز هم ثبت/ذخیره کنید؟',
        confirmLabel: 'ادامه', cancelLabel: 'انصراف'
      });
      if (!go) return;
    }
    f.busy = true;
    const btn = document.getElementById('btnSave');
    if (btn) { btn.disabled = true; btn.innerHTML = icon('i-save') + ' در حال ذخیره…'; }
    try {
      if (f.recordId) {
        const upd = await Records.update(f.recordId, { firstName, lastName, alias, notes, tags, status });
        if (!upd.ok) throw new Error(upd.message);
        if (f.images.length) {
          const valid = f.images.filter((i) => i.processing !== 'error' || i.dataUrl);
          const toAttach = valid.map((i) => ({
            dataUrl: i.dataUrl, width: i.width, height: i.height, bytes: i.bytes, fileName: i.fileName,
            descriptors: i.faces && i.faces.length ? i.faces : null
          })).filter((i) => i.dataUrl);
          if (toAttach.length) {
            const r = await Records.attachImages(upd.record, toAttach, { skipEngine: !Engine.isReady() });
            summarizeAttach(r);
          }
        }
        toast('تغییرات ذخیره شد.', 'success');
        f.images = []; f.recordId = null; f.busy = false;
        Router.go('record-detail', { id: upd.record.id });
      } else {
        const toAttach = f.images.filter((i) => i.dataUrl).map((i) => ({
          dataUrl: i.dataUrl, width: i.width, height: i.height, bytes: i.bytes, fileName: i.fileName,
          descriptors: i.faces && i.faces.length ? i.faces : null
        }));
        const res = await Records.create({ firstName, lastName, alias, notes, tags, status }, toAttach, { skipEngine: !Engine.isReady() });
        if (!res.ok) throw new Error(res.message || 'ثبت ناموفق بود');
        const saved = res.record;
        const faces = res.details.faces;
        const imgs = res.details.images;
        f.images = []; f.recordId = null; f.busy = false;
        Modal.open({
          title: 'پرونده ثبت شد',
          sub: 'اطلاعات با موفقیت در دستگاه شما ذخیره شد',
          body: '<div class="stack">' +
            '<div class="alert success">' + icon('i-check') + '<div><b>' + esc(Records.name(saved)) + '</b><br>شناسه: <span class="mono">' + esc(saved.id) + '</span></div></div>' +
            '<div class="kv"><span>تصاویر ذخیره‌شده</span><b>' + fmtInt(imgs) + '</b></div>' +
            '<div class="kv"><span>بردارهای ویژگی استخراج‌شده</span><b>' + fmtInt(faces) + '</b></div>' +
            '<div class="kv"><span>وضعیت قابل شناسایی</span><b>' + (faces > 0 ? 'بله' : 'خیر (ویژگی چهره ندارد)') + '</b></div>' +
            (faces === 0 ? '<div class="alert warn">' + icon('i-warn') + '<div>اطلاعات ذخیره شد اما ویژگی چهره استخراج نشد؛ این پرونده فعلاً در شناسایی شرکت نمی‌کند. موتور را فعال کنید و از صفحه پرونده، تصاویر را بازپردازش کنید.</div></div>' : '') +
            '</div>',
          actions: [
            { label: 'مشاهده پرونده', variant: 'primary', onClick: () => { Modal.close(); Router.go('record-detail', { id: saved.id }); } },
            { label: 'فهرست پرونده‌ها', variant: 'ghost', onClick: () => { Modal.close(); Router.go('records'); } }
          ]
        });
        renderDashboardSoon();
      }
    } catch (e) {
      f.busy = false;
      if (btn) { btn.disabled = false; btn.innerHTML = icon('i-save') + ' ثبت پرونده'; }
      toast('ذخیره ناموفق بود: ' + (e.message || 'خطای نامشخص'), 'error', 6500);
      await Logs.add('error', 'خطای ذخیره پرونده: ' + (e.message || ''), 'error');
    }
  }

  function summarizeAttach(r) {
    if (!r) return;
    if (r.failed && r.failed.length) {
      toast(faNum(r.failed.length) + ' تصویر بدون ویژگی چهره ذخیره شد: ' + r.failed[0].message, 'warn', 6000);
    }
  }
